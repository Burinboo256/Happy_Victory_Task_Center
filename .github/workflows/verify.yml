name: Verify repository
on:
  push:
    paths: ['web/**', 'apps-script/**', 'tests/**', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['web/**', 'apps-script/**', 'tests/**', 'tools/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hvr
          POSTGRES_PASSWORD: hvr-ci-test
          POSTGRES_DB: hvr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hvr -d hvr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://hvr:hvr-ci-test@127.0.0.1:5432/hvr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --diagnostic-level=warn
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:postgres
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:api
      - run: npm run test:load -- --users=5 --tasks=250 --delay-ms=60
      - name: Check Apps Script regression suite
        working-directory: .
        run: |
          node tools/check.mjs
          node --test --test-isolation=none tests/*.test.mjs
