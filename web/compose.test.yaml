services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hvr
      POSTGRES_PASSWORD: hvr-local-test
      POSTGRES_DB: hvr_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hvr -d hvr_test']
      interval: 2s
      timeout: 2s
      retries: 30
