<script>
'use strict';
(() => {
  const BOOT = window.HVR_BOOT || {};
  const $ = (q, root = document) => root.querySelector(q);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const safeUrl = value => { try { const u = new URL(value); return u.protocol === 'https:' ? esc(u.href) : ''; } catch { return ''; } };
  const icons = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    tasks:'<rect x="5" y="4" width="15" height="17" rx="2"/><path d="M9 3h7v4H9zM9 12h7M9 16h5"/>',
    inbox:'<path d="M4 4h16l2 12v4H2v-4L4 4zM2 16h6l2 2h4l2-2h6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/>',
    chart:'<path d="M4 3v18h17M8 16v-5M13 16V6M18 16v-8"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14c2 1 3 3 3 5"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    alert:'<path d="m12 3 10 18H2L12 3zM12 9v5M12 17v.1"/>',
    search:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
    chevron:'<path d="m9 5 7 7-7 7"/>',
    back:'<path d="m15 5-7 7 7 7"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
    refresh:'<path d="M20 8a8 8 0 0 0-14-3L3 8M3 3v5h5M4 16a8 8 0 0 0 14 3l3-3M21 21v-5h-5"/>',
    logout:'<path d="M9 4H4v16h5M9 12h12m-4-4 4 4-4 4"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/>',
    menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
    building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-5h6v5M8 7h2M14 7h2M8 11h2M14 11h2"/>',
    shield:'<path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6l-9-4zM8 12l3 3 5-6"/>'
  };
  const icon = name => `<svg aria-hidden="true" viewBox="0 0 24 24">${icons[name] || icons.tasks}</svg>`;
  const statusNames = { New:'งานเข้าใหม่', 'In Progress':'กำลังดำเนินการ', Waiting:'รอข้อมูล', 'On Hold':'พักงาน', Completed:'เสร็จสิ้น', Cancelled:'ยกเลิก' };
  const statusClass = { New:'new', 'In Progress':'progress', Waiting:'waiting', 'On Hold':'hold', Completed:'completed', Cancelled:'cancelled' };
  const priorityNames = { Low:'ต่ำ', Normal:'ปกติ', High:'สูง', Urgent:'ด่วนมาก' };
  const navNames = { dashboard:'ภาพรวมงาน', tasks:'งานทั้งหมด', inbox:'งานเข้าใหม่', followups:'งานที่ต้องติดตาม', calendar:'ปฏิทินงาน', reports:'รายงาน', team:'ทีมของเรา', history:'ประวัติงาน' };
  const isManager = () => ['Secretary','Admin'].includes(state.data?.user.role);
  const open = t => !['Completed','Cancelled'].includes(t.status);
  const today = () => state.data?.today || new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const late = t => open(t) && t.dueDate && t.dueDate < today();
  const needsFollowup = t => open(t) && t.followupDate && t.followupDate <= today();
  const fmtDate = (date, full = false) => date ? new Intl.DateTimeFormat('th-TH',{day:'numeric',month:full?'long':'short',...(full?{year:'numeric'}:{}),timeZone:'Asia/Bangkok'}).format(new Date(date.length===10?date+'T12:00:00+07:00':date)) : 'ยังไม่กำหนด';
  const fmtTime = date => date ? new Intl.DateTimeFormat('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}).format(new Date(date)) : '';
  const person = id => state.data?.users.find(u => u.id === id) || {name:'Agent',id};
  const initials = name => String(name).trim().slice(0,2);
  const avatar = (u, n = 0) => `<span class="avatar c${n%5}" aria-hidden="true">${esc(initials(u.name))}</span>`;
  const badge = status => `<span class="badge ${statusClass[status] || 'hold'}">${esc(statusNames[status] || status)}</span>`;
  const requestId = () => crypto.randomUUID();
  const store = {get(k){try{return sessionStorage.getItem(k);}catch{return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch{throw new Error('เบราว์เซอร์ต้องอนุญาตพื้นที่จัดเก็บของเว็บเพื่อเข้าสู่ระบบ');}},remove(k){try{sessionStorage.removeItem(k);}catch{}}};
  const state = { data:null, token:store.get('hvr-session') || '', page:'dashboard', tab:'all', search:'', agent:'all', priority:'all', pageIndex:0, view:'list', detail:null, modal:'', error:'', busy:false, calendarMonth:new Date().toISOString().slice(0,7), calendarDay:'', priorFocus:null };
  // Only a local navigation intent crosses OAuth; data access still requires bootstrap.
  let pendingView = (BOOT.view === 'create' || (BOOT.demo && new URLSearchParams(window.location.search).get('view') === 'create')) ? 'create' : ((BOOT.ticket || BOOT.error) && store.get('hvr-return-view') === 'create' ? 'create' : '');
  let toastTimer, loadGeneration = 0;
  function toast(message){ $('#toast').textContent=message; $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500); }
  function gas(method,...args){ return new Promise((resolve,reject)=>{ if (!window.google?.script?.run) return reject(new Error('กรุณาเปิดระบบผ่าน URL Web App ของ Google Apps Script')); google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message || 'ไม่สามารถเชื่อมต่อระบบ')))[method](...args); }); }
  async function rpc(action,payload={}) { return BOOT.demo ? window.HVR_DEMO.api(action,payload) : gas('api',state.token,action,payload); }
  function loading(on){ document.querySelectorAll('.loading-line').forEach(n=>n.remove()); if(on){const n=document.createElement('div');n.className='loading-line';document.body.append(n);} }
  function empty(title='ยังไม่มีรายการงาน',message='เมื่อมีงานใหม่ รายการจะแสดงที่นี่'){return `<div class="empty">${icon('inbox')}<strong>${esc(title)}</strong>${esc(message)}</div>`;}
  async function load(force=false){
    const generation=++loadGeneration; loading(true);
    try { const data=await rpc('bootstrap',{force}); if(generation!==loadGeneration)return; if(!state.data)state.calendarMonth=data.today.slice(0,7);state.data=data;state.error='';render(); if(pendingView==='create'){pendingView='';store.remove('hvr-return-view');createForm();} }
    catch(e){if(generation!==loadGeneration)return; if(/UNAUTHENTICATED|FORBIDDEN/.test(e.message)){state.token='';store.remove('hvr-session');state.data=null;}state.error=e.message;if(state.data)render();else renderLogin(e.message);}
    finally{if(generation===loadGeneration)loading(false);}
  }
  function renderLogin(error='') {
    $('#app').innerHTML=`<main class="login-page"><section class="login-story"><div class="brand"><div class="brand-mark">hv<span>✦</span></div><div><strong>Happy Victory</strong><small>RINLYN TASK CENTER</small></div></div><div><span class="login-tag">A LITTLE MORE ORGANIZED. A LOT MORE POSSIBLE.</span><h1>Great things,<br>one task at a time.</h1><p>พื้นที่ทำงานที่ช่วยให้ทุกการประสานงาน<br>เป็นเรื่องง่าย และทุกงานเดินหน้าต่อได้</p></div><footer>HAPPY VICTORY RINLYN · AGENT & SECRETARY WORKSPACE</footer></section><section class="login-main"><div class="eyebrow">WELCOME TO YOUR WORKSPACE</div><h2>ยินดีต้อนรับกลับมา</h2><p>เข้าสู่ระบบเพื่อติดตามงานและทำงานร่วมกัน</p>${error?`<div class="form-error" role="alert">${esc(error)}</div>`:''}<button class="btn" data-action="login" id="login-button"><span class="login-icon">G</span> เข้าสู่ระบบด้วยบัญชี Google</button><div id="login-link"></div><div class="login-note">${icon('shield')} สำหรับ Agent และเลขาฯ ที่ได้รับอนุญาตเท่านั้น<br>เข้าสู่ระบบด้วยอีเมลที่ผู้ดูแลลงทะเบียนในระบบ</div></section></main>`;
  }
  function render(){
    const {user,tasks,users}=state.data;
    const nav=isManager()?[['dashboard','grid'],['tasks','tasks'],['inbox','inbox'],['followups','clock'],['calendar','calendar'],['reports','chart'],['team','users']]:[['dashboard','grid'],['tasks','tasks'],['followups','clock'],['calendar','calendar'],['history','check']];
    $('#app').innerHTML=`<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">hv<span>✦</span></div><div><strong>Happy Victory</strong><small>RINLYN TASK CENTER</small></div></div><div class="workspace"><div class="workspace-icon">${icon('building')}</div><div><strong>Happy Victory Team</strong>พื้นที่ทำงานร่วมกัน</div></div><div class="nav-label">WORKSPACE</div><nav class="nav" aria-label="เมนูหลัก">${nav.map(([key,i])=>`<button data-action="navigate" data-page="${key}" class="${state.page===key?'active':''}" ${state.page===key?'aria-current="page"':''}>${icon(i)}${esc(key==='tasks'&&!isManager()?'งานของฉัน':navNames[key])}${key==='inbox'?`<span class="nav-count">${tasks.filter(t=>t.status==='New').length}</span>`:key==='followups'?`<span class="nav-count">${tasks.filter(needsFollowup).length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-note"><div class="sparkle">✦ &nbsp; A little progress, every day.</div><strong>ทุกงานสำคัญ ทุกความคืบหน้ามีค่า</strong><p>เริ่มจากงานเล็ก ๆ แล้วเราจะเดินหน้า<br>ไปถึงเป้าหมายด้วยกัน</p></div><div class="profile">${avatar(user)}<div><strong>${esc(user.name)}</strong><small>${isManager()?'เลขาฯ · ดูแลงานทั้งหมด':'Agent · งานของฉัน'}</small></div><button class="icon-btn" data-action="logout" aria-label="ออกจากระบบ">${icon('logout')}</button></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><button class="icon-btn mobile-menu" data-action="menu" aria-label="เปิดเมนู">${icon('menu')}</button><span>Workspace</span>${icon('chevron')}<span>${esc(navNames[state.page])}</span></div><div class="top-actions"><button class="btn small" data-action="line-settings">LINE</button><span class="date-label">${esc(fmtDate(today(),true))}</span><button class="icon-btn sync-button" data-action="refresh" aria-label="โหลดข้อมูลล่าสุด">${icon('refresh')}</button><button class="icon-btn" data-action="navigate" data-page="followups" aria-label="ดูงานที่ต้องติดตาม">${icon('bell')}</button>${avatar(user)}</div></header>${BOOT.demo?`<div class="demo-banner"><span>โหมดทดลอง · ข้อมูลสมมติในเบราว์เซอร์ ยังไม่เชื่อมต่อ Airtable</span><div class="demo-controls"><label for="demo-role">ทดลองเป็น</label><select id="demo-role">${window.HVR_DEMO.users().map(u=>`<option value="${esc(u.id)}" ${u.id===user.id?'selected':''}>${esc(u.name)} · ${u.role==='Agent'?'Agent':'เลขาฯ'}</option>`).join('')}</select><button data-action="reset-demo">เริ่มข้อมูลใหม่</button></div></div>`:''}<div class="content" id="page"></div></main>`;
    renderPage();
  }
  function heading(){
    const dashboard=state.page==='dashboard';
    return `<div class="page-heading"><div><div class="eyebrow">${dashboard?'YOUR DAY, AT A GLANCE':'HAPPY VICTORY RINLYN'}</div><h1>${dashboard?`สวัสดี, ${esc(state.data.user.name.split(' ')[0])} <span class="hello">☀</span>`:esc(state.page==='tasks'&&!isManager()?'งานของฉัน':navNames[state.page])}</h1><p>${dashboard?'มาเริ่มต้นวันดี ๆ และดูแลทุกงานให้เดินหน้าไปด้วยกัน':state.page==='followups'?'ดูนัดติดตามทั้งหมด รวมถึงงานที่ถึงกำหนดแล้ว':state.page==='history'?'รวบรวมงานที่เสร็จสิ้นและยกเลิกแล้ว':'ทุกความคืบหน้า อยู่ในพื้นที่เดียวกัน'}</p></div><button class="btn primary" data-action="create">${icon('plus')} ส่งงานใหม่</button></div>`;
  }
  function stats(){ const ts=state.data.tasks; const values=[ts.filter(open).length,ts.filter(needsFollowup).length,ts.filter(late).length,ts.filter(t=>t.status==='Completed').length];return `<div class="stats">${[['งานคงค้าง','tasks','open','งานที่ยังอยู่ระหว่างดำเนินการ'],['ต้องติดตามวันนี้','clock','follow','รวมที่เลยวันนัดติดตาม'],['งานเกินกำหนด','alert','late','งานที่ควรเร่งดำเนินการ'],['งานเสร็จสิ้น','check','completed','ปิดงานเรียบร้อยแล้ว']].map(([label,i,tab,note],n)=>`<button class="stat" data-action="stat" data-tab="${tab}"><span class="stat-label">${label}</span><span class="stat-icon">${icon(i)}</span><strong>${values[n].toString().padStart(2,'0')}</strong><span class="stat-footer">${note}</span></button>`).join('')}</div>`;}
  function renderPage(){
    const page=$('#page');if(!page)return;
    const active=document.activeElement; const focusId=active?.id; const selection=active?.selectionStart;
    page.innerHTML=heading()+(state.error?`<div class="error-banner" role="alert">${esc(state.error)}<button class="text-btn" data-action="refresh">ลองอีกครั้ง</button></div>`:'')+
      (state.page==='dashboard'?`${stats()}<div class="dashboard-grid"><div>${taskPanel()}${isManager()?teamStrip():''}</div><aside class="right-rail">${followupPanel()}${overviewPanel()}</aside></div>`:
       ['tasks','inbox','followups','history'].includes(state.page)?taskPanel():state.page==='reports'?`${stats()}${reports()}`:state.page==='calendar'?calendar():teamPanel())+
       `<footer class="footer"><span><strong>Happy Victory Rinlyn</strong> Task Center</span><span><span class="live-dot"></span>${BOOT.demo?'ข้อมูลตัวอย่าง':'เชื่อมต่อผ่าน Apps Script'} · อัปเดต ${esc(fmtTime(state.data.syncedAt))} น.</span></footer>`;
    if(focusId){const input=document.getElementById(focusId);if(input){input.focus();if(typeof selection==='number'&&input.setSelectionRange)input.setSelectionRange(selection,selection);}}
  }
  function pageTasks(){return state.data.tasks.filter(t=>state.page==='inbox'?t.status==='New':state.page==='followups'?open(t)&&t.followupDate:state.page==='history'?!open(t):true);}
  function filteredTasks(){
    return pageTasks().filter(t=>{
      const tab=state.tab;
      if(tab==='open'&&!open(t)||tab==='follow'&&!needsFollowup(t)||tab==='late'&&!late(t)||tab==='completed'&&t.status!=='Completed'||tab==='New'&&t.status!=='New'||tab==='In Progress'&&t.status!=='In Progress'||tab==='Waiting'&&t.status!=='Waiting')return false;
      if(state.agent!=='all'&&t.agentId!==state.agent||state.priority!=='all'&&t.priority!==state.priority)return false;
      return `${t.code} ${t.title} ${t.description} ${person(t.agentId).name}`.toLowerCase().includes(state.search.toLowerCase());
    }).sort((a,b)=>{
      if(state.page==='followups')return a.followupDate.localeCompare(b.followupDate);
      if(open(a)!==open(b))return open(a)?-1:1;
      return (late(b)?1:0)-(late(a)?1:0)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||b.createdAt.localeCompare(a.createdAt);
    });
  }
  function taskPanel(){
    const rows=filteredTasks(), size=7, pages=Math.max(1,Math.ceil(rows.length/size)); state.pageIndex=Math.min(state.pageIndex,pages-1);const sliced=rows.slice(state.pageIndex*size,(state.pageIndex+1)*size);
    const base=pageTasks();const tabs=[['all','ทั้งหมด',base.length],['open','คงค้าง',base.filter(open).length],['In Progress','กำลังดำเนินการ',base.filter(t=>t.status==='In Progress').length],['Waiting','รอข้อมูล',base.filter(t=>t.status==='Waiting').length],['completed','เสร็จสิ้น',base.filter(t=>t.status==='Completed').length]];
    return `<section class="panel"><div class="panel-title"><div><h2>${state.page==='followups'?'รายการนัดติดตาม':state.page==='inbox'?'กล่องงานเข้า':state.page==='history'?'ประวัติงาน':'รายการงาน'+(!isManager()?'ของฉัน':'ทั้งหมด')}</h2><small>${rows.length} รายการ ${state.page==='followups'?'· เรียงตามวันนัดติดตาม':'· ดูแลทุกงานให้เป็นไปตามแผน'}</small></div><div class="view-switch" aria-label="รูปแบบรายการ"><button data-action="view" data-view="list" class="${state.view==='list'?'active':''}" aria-label="แสดงตาราง" aria-pressed="${state.view==='list'}">${icon('list')}</button><button data-action="view" data-view="cards" class="${state.view==='cards'?'active':''}" aria-label="แสดงการ์ด" aria-pressed="${state.view==='cards'}">${icon('grid')}</button></div></div><div class="tabbar" aria-label="กรองสถานะ">${tabs.map(([k,label,n])=>`<button data-action="tab" data-tab="${k}" class="${state.tab===k?'active':''}">${label}<span class="count">${n}</span></button>`).join('')}${['late','follow','New'].includes(state.tab)?`<button class="active" data-action="tab" data-tab="${state.tab}">${{late:'เกินกำหนด',follow:'ต้องติดตามวันนี้',New:'งานใหม่'}[state.tab]}</button>`:''}</div><div class="filters"><div class="search">${icon('search')}<input id="task-search" type="search" placeholder="ค้นหาชื่องาน รหัสงาน หรือ Agent…" aria-label="ค้นหางาน" value="${esc(state.search)}"></div>${isManager()?`<select id="agent-filter" aria-label="กรอง Agent"><option value="all">Agent ทั้งหมด</option>${state.data.users.filter(u=>u.role==='Agent'&&u.active!==false).map(u=>`<option value="${esc(u.id)}" ${state.agent===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}<select id="priority-filter" aria-label="กรองความเร่งด่วน"><option value="all">ทุกความเร่งด่วน</option>${Object.entries(priorityNames).map(([v,n])=>`<option value="${v}" ${state.priority===v?'selected':''}>${n}</option>`).join('')}</select></div>${rows.length?(state.view==='list'?`<div class="table-scroll"><table><thead><tr><th>ชื่องาน / รหัสงาน</th>${isManager()?'<th>Agent</th>':''}<th>สถานะ</th><th class="priority-col">ความเร่งด่วน</th><th>${state.page==='followups'?'นัดติดตาม':'กำหนดส่ง'}</th><th><span class="sr-only">ดู</span></th></tr></thead><tbody>${sliced.map(taskRow).join('')}</tbody></table></div>`:`<div class="task-cards">${sliced.map(t=>`<button class="task-card" data-action="detail" data-id="${esc(t.id)}">${badge(t.status)}<span class="task-title">${esc(t.title)}</span><span class="task-meta">${esc(t.code)} · ${esc(person(t.agentId).name)}</span><span class="task-card-bottom"><span class="priority ${esc(t.priority)}">${priorityNames[t.priority]}</span><span class="${late(t)?'late':''}">${esc(fmtDate(t.dueDate))}</span></span></button>`).join('')}</div>`):empty('ไม่พบงานในรายการนี้','ลองเปลี่ยนคำค้นหาหรือตัวกรอง หรือส่งงานใหม่ได้เลย')}<div class="pagination"><span>${rows.length?state.pageIndex*size+1:0}–${Math.min((state.pageIndex+1)*size,rows.length)} จาก ${rows.length} รายการ</span><div class="pager"><button class="icon-btn" data-action="page-prev" aria-label="หน้าก่อนหน้า" ${state.pageIndex===0?'disabled':''}>${icon('back')}</button><span class="page-number">${state.pageIndex+1} / ${pages}</span><button class="icon-btn" data-action="page-next" aria-label="หน้าถัดไป" ${state.pageIndex>=pages-1?'disabled':''}>${icon('chevron')}</button></div></div></section>`;
  }

ail"><strong>${esc(fmtDate(f.date,true))}</strong> <span class="badge ${f.status==='Done'?'completed':'waiting'}">${{Pending:'รอติดตาม',Done:'ติดตามแล้ว',Skipped:'ข้ามนัด'}[f.status]||esc(f.status)}</span><p>${esc(f.notes)}</p>${f.status==='Pending'?`<button class="btn small soft" data-action="resolve" data-id="${esc(f.id)}">บันทึกผลการติดตาม</button>`:''}</div>`).join('')}${open(t)?`<form id="followup-form"><div class="form-row"><div class="form-field"><label for="followup-date">วันนัดติดตามใหม่ *</label><input id="followup-date" name="date" type="date" value="${today()}" required></div><div class="form-field"><label for="followup-note">เรื่องที่ต้องติดตาม</label><input id="followup-note" name="notes" maxlength="2000" placeholder="เช่น โทรสอบถามเอกสาร"></div></div><div class="form-actions"><button class="btn small" type="submit">${icon('calendar')} เพิ่มนัดติดตาม</button></div></form>`:''}`:''}<h3 class="section-title">ความคืบหน้าและการสนทนา <span class="badge hold">${updates.length}</span></h3><div class="timeline">${updates.length?updates.map(u=>`<article class="timeline-item"><small>${esc(fmtDate(u.createdAt))} · ${esc(fmtTime(u.createdAt))} น.${!u.visible?'<span class="private">ภายใน</span>':''}</small><strong>${esc(u.actor)} ${u.newStatus?'· '+esc(statusNames[u.newStatus]||u.newStatus):''}</strong><p>${esc(u.message)}</p></article>`).join(''):'<p style="color:var(--muted);font-size:11px">ยังไม่มีความคืบหน้า</p>'}</div><form id="comment-form"><div class="form-field"><label for="comment-message">เพิ่มข้อความหรือข้อมูลประกอบ</label><textarea id="comment-message" name="message" required maxlength="3000" placeholder="เขียนข้อความถึงทีม…"></textarea></div>${isManager()?'<label class="check-label"><input type="checkbox" name="internal"> บันทึกภายใน · Agent มองไม่เห็น</label>':''}<div class="form-actions"><button class="btn primary small" type="submit">ส่งข้อความ</button></div></form>`;}

    }
    else if(a==='line-toggle'){
      button.disabled=true;try{await rpc('linePreference',{enabled:button.dataset.enabled==='true'});closeModal();await load(true);toast('บันทึกการรับสรุป LINE แล้ว');}catch(err){toast(err.message);button.disabled=false;}
    }
    else if(a==='navigate')navigate(button.dataset.page);
    else if(a==='menu')$('#sidebar').classList.toggle('open');
    else if(a==='stat'){state.page='tasks';state.tab=button.dataset.tab;state.search='';state.agent='all';state.priority='all';state.pageIndex=0;render();}
    else if(a==='tab'){state.tab=button.dataset.tab;state.pageIndex=0;renderPage();}
    else if(a==='view'){state.view=button.dataset.view;renderPage();}
    else if(a==='page-prev'||a==='page-next'){state.pageIndex+=a==='page-prev'?-1:1;renderPage();}
    else if(a==='create')createForm();
    else if(a==='detail')showDetail(button.dataset.id);
    else if(a==='close'){detailGeneration++;closeModal();}
    else if(a==='refresh'){await load(true);toast(state.error?'ยังโหลดข้อมูลไม่สำเร็จ':'อัปเดตข้อมูลล่าสุดแล้ว');}
    else if(a==='resolve')resolveForm(button.dataset.id);
    else if(a==='calendar-prev'||a==='calendar-next'){const [y,m]=state.calendarMonth.split('-').map(Number);state.calendarMonth=new Date(Date.UTC(y,m-1+(a==='calendar-next'?1:-1),1)).toISOString().slice(0,7);state.calendarDay='';renderPage();}
    else if(a==='calendar-day'){state.calendarDay=button.dataset.date;renderPage();}
    else if(a==='reset-demo'){window.HVR_DEMO.reset();await load();toast('เริ่มข้อมูลตัวอย่างใหม่แล้ว');}
    else if(a==='logout'){if(BOOT.demo){toast('นี่คือโหมดทดลอง เลือกบทบาทเพื่อทดลองสิทธิ์ได้จากแถบด้านบน');return;}try{await gas('logout',state.token);}catch{toast('ออกจากระบบบนเครื่องนี้แล้ว เซสชันบนเซิร์ฟเวอร์จะหมดอายุตามกำหนด');}state.token='';state.data=null;store.remove('hvr-session');closeModal();renderLogin();}
    else if(a==='login'){
      button.disabled=true;
      try{if(pendingView==='create')store.set('hvr-return-view','create');else store.remove('hvr-return-view');}catch(err){renderLogin(err.message);return;}
      try { const bytes=crypto.getRandomValues(new Uint8Array(32)),verifier=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');store.set('hvr-verifier',verifier);const challenge=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))),b=>b.toString(16).padStart(2,'0')).join('');const url=await gas('startGoogleLogin',challenge);$('#login-link').innerHTML=`<a class="btn primary" href="${safeUrl(url)}" target="_top">ดำเนินการต่อที่ Google ${icon('arrow')}</a>`;button.textContent='เตรียมการเข้าสู่ระบบแล้ว';}
      catch(err){renderLogin(err.message);}
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='task-search'){state.search=e.target.value;state.pageIndex=0;renderPage();}});
  document.addEventListener('change',async e=>{if(e.target.id==='agent-filter'){state.agent=e.target.value;state.pageIndex=0;renderPage();}else if(e.target.id==='priority-filter'){state.priority=e.target.value;state.pageIndex=0;renderPage();}else if(e.target.id==='demo-role'){window.HVR_DEMO.setUser(e.target.value);closeModal();state.page='dashboard';state.tab='all';state.search='';state.agent='all';state.priority='all';await load();}});
  document.addEventListener('submit',async e=>{
    const form=e.target;if(!['create-form','status-form','comment-form','followup-form','resolve-form'].includes(form.id))return;e.preventDefault();if(state.busy)return;
    const fields=Object.fromEntries(new FormData(form));let action,payload;
    const task=state.detail?.task;
    if(form.id==='create-form'){action='create';payload=fields;}
    else if(form.id==='status-form'){action='status';payload={...fields,id:task.id,version:task.version};}
    else if(form.id==='comment-form'){action='comment';payload={message:fields.message,id:task.id,visible:!fields.internal};}
    else if(form.id==='followup-form'){action='followup';payload={...fields,id:task.id};}
    else {action='resolveFollowup';payload={...fields,id:form.dataset.task,followupId:form.dataset.followup};}
    // Retry unchanged payloads with the same key after a transient or partial failure.
    const fingerprint=JSON.stringify(payload);if(form.dataset.fingerprint!==fingerprint){form.dataset.fingerprint=fingerprint;form.dataset.request=requestId();}
    payload.requestId=form.dataset.request;state.busy=true;form.querySelectorAll('button,input,select,textarea').forEach(n=>n.disabled=true);loading(true);
    try{const result=await rpc(action,payload);if(action==='create'){closeModal(true);await load();await showDetail(result.id);toast('ส่งงานเรียบร้อยแล้ว');}else{state.detail=await rpc('detail',{id:result.id});state.modal='detail';renderDetail();await load();toast('บันทึกเรียบร้อยแล้ว');}}
    catch(err){formError(form,err.message);if(/UNAUTHENTICATED|FORBIDDEN/.test(err.message))toast('สิทธิ์อาจมีการเปลี่ยนแปลง กรุณาโหลดข้อมูลล่าสุด');}
    finally{state.busy=false;form.querySelectorAll('button,input,select,textarea').forEach(n=>n.disabled=false);loading(false);}
  });
  document.addEventListener('keydown',e=>{if(!$('.drawer'))return;if(e.key==='Escape'&&!state.busy){detailGeneration++;closeModal();}if(e.key==='Tab'){const nodes=[...$('.drawer').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.drawer'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  async function init(){
    if(BOOT.demo){await load();return;}
    if(BOOT.error){renderLogin(BOOT.error);return;}
    if(BOOT.lineTicket){
      loading(true);
      try{const verifier=store.get('hvr-line-verifier');if(!verifier||!state.token)throw new Error('กรุณาเข้าสู่ระบบและเชื่อม LINE จากเบราว์เซอร์เดิม');await gas('completeLineLink',state.token,BOOT.lineTicket,verifier);store.remove('hvr-line-verifier');await load(true);toast('เชื่อม LINE และเปิดรับสรุปแล้ว กรุณาเพิ่ม OA เป็นเพื่อนด้วย');}
      catch(e){await load(true);if(state.data){state.error=e.message;render();}else renderLogin(e.message);}
      finally{loading(false);}return;
    }
    if(BOOT.ticket){loading(true);try{const verifier=store.get('hvr-verifier');if(!verifier)throw new Error('ไม่พบข้อมูลเริ่มเข้าสู่ระบบ กรุณาใช้เบราว์เซอร์เดิมและเปิดลิงก์ Web App โดยตรง');const result=await gas('completeGoogleLogin',BOOT.ticket,verifier);state.token=result.token;store.set('hvr-session',result.token);store.remove('hvr-verifier');}catch(e){renderLogin(e.message);loading(false);return;}}
    if(state.token)await load();else renderLogin();
  }
  init();
})();
</script>
